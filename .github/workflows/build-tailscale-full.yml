name: 编译 Tailscale + LuCI (x86_64 only)

on:
  workflow_dispatch:
    inputs:
      tailscale_version:
        description: 'Tailscale 版本'
        required: false
        default: '1.98.2'

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出 ImmortalWrt v24.10.6
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: v24.10.6
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-pip python3-setuptools rsync subversion swig unzip wget zlib1g-dev

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加入 luci-app-tailscale-community
        run: |
          rm -rf package/luci-app-tailscale-community
          git clone --depth=1 https://github.com/Tokisaki-Galaxy/luci-app-tailscale-community.git package/luci-app-tailscale-community

      - name: 获取 Tailscale HASH
        id: hash
        run: |
          VERSION="${{ github.event.inputs.tailscale_version }}"
          wget -q https://codeload.github.com/tailscale/tailscale/tar.gz/v${VERSION} -O tailscale.tar.gz
          HASH=$(sha256sum tailscale.tar.gz | awk '{print $1}')
          echo "HASH=$HASH" >> $GITHUB_OUTPUT
          echo "=== Tailscale 信息 ==="
          echo "版本: $VERSION"
          echo "HASH: $HASH"

      - name: 创建 Tailscale Makefile
        run: |
          mkdir -p package/network/tailscale/files

          cat > package/network/tailscale/Makefile << 'EOF'
          #
          # Copyright (C) 2021 CZ.NIC, z. s. p. o.[](https://www.nic.cz/)
          #
          # This is free software, licensed under the GNU General Public License v2.
          # See /LICENSE for more information.
          #
          include $(TOPDIR)/rules.mk

          PKG_NAME:=tailscale
          PKG_VERSION:=${{ github.event.inputs.tailscale_version }}
          PKG_RELEASE:=1
          PKG_SOURCE:=$(PKG_NAME)-$(PKG_VERSION).tar.gz
          PKG_SOURCE_URL:=https://codeload.github.com/tailscale/tailscale/tar.gz/v$(PKG_VERSION)?
          PKG_HASH:=${{ steps.hash.outputs.HASH }}
          PKG_MAINTAINER:=Zephyr Lykos <self@mochaa.ws>, \
          	Sandro Jäckel <sandro.jaeckel@gmail.com>
          PKG_LICENSE:=BSD-3-Clause
          PKG_LICENSE_FILES:=LICENSE
          PKG_CPE_ID:=cpe:/a:tailscale:tailscale
          PKG_BUILD_DIR:=$(BUILD_DIR)/tailscale-$(PKG_VERSION)
          PKG_BUILD_DEPENDS:=golang/host
          PKG_BUILD_PARALLEL:=1
          PKG_BUILD_FLAGS:=no-mips16

          GO_PKG:=tailscale.com/cmd/tailscaled
          GO_PKG_LDFLAGS:=-X 'tailscale.com/version.longStamp=$(PKG_VERSION)-$(PKG_RELEASE) (ImmortalWrt)'
          GO_PKG_LDFLAGS_X:=tailscale.com/version.shortStamp=$(PKG_VERSION)
          GO_PKG_TAGS:=ts_include_cli,ts_omit_aws,ts_omit_bird,ts_omit_completion,ts_omit_kube,ts_omit_systray,ts_omit_taildrop,ts_omit_tap,ts_omit_tpm

          include $(INCLUDE_DIR)/package.mk
          include $(TOPDIR)/feeds/packages/lang/golang/golang-package.mk

          define Package/tailscale
            SECTION:=net
            CATEGORY:=Network
            SUBMENU:=VPN
            TITLE:=Zero config VPN
            URL:=https://tailscale.com
            DEPENDS:=$(GO_ARCH_DEPENDS) +ca-bundle +kmod-tun
            PROVIDES:=tailscaled
          endef

          define Package/tailscale/description
            It creates a secure network between your servers, computers,
            and cloud instances. Even when separated by firewalls or subnets.
          endef

          define Package/tailscale/conffiles
          /etc/config/tailscale
          /etc/tailscale/
          endef

          define Package/tailscale/install
          	$(INSTALL_DIR) $(1)/usr/sbin $(1)/etc/init.d $(1)/etc/config
          	$(INSTALL_BIN) $(GO_PKG_BUILD_BIN_DIR)/tailscaled $(1)/usr/sbin
          	$(LN) tailscaled $(1)/usr/sbin/tailscale
          	$(INSTALL_BIN) ./files/tailscale.init $(1)/etc/init.d/tailscale
          	$(INSTALL_DATA) ./files/tailscale.conf $(1)/etc/config/tailscale
          endef

          $(eval $(call BuildPackage,tailscale))
          EOF

          # 创建必要文件
          cat > package/network/tailscale/files/tailscale.init << 'EOT'
          #!/bin/sh /etc/rc.common
          START=99
          USE_PROCD=1
          start_service() {
              procd_open_instance
              procd_set_param command /usr/sbin/tailscaled --state=/etc/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock --port=41641
              procd_set_param respawn
              procd_close_instance
          }
          EOT
          chmod +x package/network/tailscale/files/tailscale.init

          cat > package/network/tailscale/files/tailscale.conf << 'EOC'
          config tailscale 'settings'
              option enabled '0'
              option port '41641'
          EOC

      - name: 配置编译环境
        run: |
          make defconfig
          cat >> .config << EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_PACKAGE_tailscale=y
          CONFIG_PACKAGE_luci-app-tailscale-community=y
          CONFIG_PACKAGE_luci-i18n-tailscale-community-zh-cn=y
          EOF
          make defconfig
          echo "=== .config 中 tailscale 相关配置 ==="
          grep -E "tailscale|luci-app-tailscale" .config || echo "未找到配置"

      - name: 下载依赖
        run: make -j2 download V=s || true

      - name: 编译 Tailscale
        run: |
          echo "开始编译 tailscale..."
          make -j$(nproc) package/tailscale/clean package/tailscale/compile V=s 2>&1 | tee tailscale.log
          echo "=== Tailscale 编译日志尾部 ==="
          tail -n 50 tailscale.log

      - name: 编译 LuCI 界面
        run: |
          echo "开始编译 luci-app-tailscale-community..."
          make -j$(nproc) package/luci-app-tailscale-community/clean package/luci-app-tailscale-community/compile V=s 2>&1 | tee luci.log
          echo "=== LuCI 编译日志尾部 ==="
          tail -n 30 luci.log

      - name: 查找并复制 IPK 文件
        run: |
          mkdir -p ./output
          echo "=== 搜索所有 tailscale ipk ==="
          find bin/packages -name "*tailscale*.ipk" -exec ls -lh {} \;
          find bin/packages -name "*luci-app-tailscale-community*.ipk" -exec ls -lh {} \;

          cp -f bin/packages/x86_64/*tailscale*.ipk ./output/ 2>/dev/null || true
          cp -f bin/packages/x86_64/*luci-app-tailscale-community*.ipk ./output/ 2>/dev/null || true

          echo "=== 输出目录内容 ==="
          ls -lh ./output/ || echo "output 目录为空！"

          if [ ! -f ./output/tailscale*.ipk ]; then
            echo "❌ 未找到 ipk 文件，请查看上方编译日志查找错误"
          else
            echo "✅ 找到 ipk 文件"
          fi

      - name: 上传 ipk 文件
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-x86_64-ipks
          path: ./output/
          retention-days: 30
